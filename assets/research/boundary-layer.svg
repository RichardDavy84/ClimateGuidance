<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">The depth of air matters</title><desc id="desc">A conceptual comparison: equal heat inputs spread through a shallow and a deep layer. Not measured data.</desc><rect width="1000" height="560" fill="#f1f3f3"/><g font-family="Arial,sans-serif" fill="#233849"><text x="55" y="58" font-size="26">The same heat. A different volume of air.</text><text x="55" y="91" font-size="17">Conceptual illustration · not to scale</text><path d="M70 445H930" stroke="#243c48" stroke-width="3"/><rect x="95" y="337" width="325" height="106" fill="#e9ae7f"/><rect x="580" y="160" width="325" height="283" fill="#9bbcca"/><g stroke="#ad5a34" stroke-width="4"><path d="M180 240V322m-12-16 12 16 12-16M740 80V146m-12-16 12 16 12-16"/></g><text x="170" y="215" font-size="21">Equal energy input</text><text x="625" y="125" font-size="21">Equal energy input</text><text x="132" y="390" font-size="24">Shallower layer</text><text x="655" y="310" font-size="24">Deeper layer</text><text x="100" y="485" font-size="20">Larger temperature response</text><text x="585" y="485" font-size="20">Smaller temperature response</text><text x="55" y="535" font-size="16">Concept informed by Davy &amp; Esau (2016), Nature Communications</text></g></svg>
