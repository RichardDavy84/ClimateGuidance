<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Climate Guidance | Contact</title>
  <meta name="description" content="Contact Climate Guidance to discuss custom climate projections, seasonal forecast dashboards, climate-risk metrics, consulting, or interactive climate tools for your organisation." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile nav toggle -->
  <input type="checkbox" id="menu-toggle" />
  <label for="menu-toggle" class="hamburger">
    <img src="menu-icon.png" alt="Menu Icon">
  </label>

  <!-- Header -->
  <header>
    <div class="logo">
      <h1>Climate Guidance</h1>
    </div>
  </header>

  <!-- Navigation -->
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="case-studies.html">Case Studies</a>
  <a href="data-viz.html">Data Viz</a>
  <a href="about.html">About</a>
  <a href="contact.html" class="active">Contact</a>
</nav>

  <!-- Hero Section -->
  <section class="contact-hero">
    <div class="contact-hero-overlay">
      <h2>Contact Us</h2>
      <p>Tell us the climate-sensitive decision you need to make.</p>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="contact-form-container">
    <div class="contact-box">
      <p class="contact-email">
        Email us directly at <a href="mailto:hello@climateguidance.com">hello@climateguidance.com</a>
        or use the form below.
      </p>
      <form action="https://formspree.io/f/mblggkwq" method="POST">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>

        <label for="organization">Organization</label>
        <input type="text" id="organization" name="organization">

        <label for="message">Message / Project Overview *</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <input type="hidden" name="_subject" value="New Inquiry from Climate Guidance Website" />

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Floating Formbutton -->
  <script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
  <script>
    window.formbutton = window.formbutton || function () {
      (formbutton.q = formbutton.q || []).push(arguments)
    };
    formbutton("create", {
      action: "https://formspree.io/f/mblggkwq",
      title: "How can we help? Book a free 15 min consultation now",
      fields: [
        { type: "email", label: "Email:", name: "email", required: true },
        { type: "textarea", label: "Message:", name: "message" },
        { type: "submit" }
      ],
      styles: {
        title: { backgroundColor: "gray" },
        button: { backgroundColor: "gray" }
      }
    });
  </script>

  <!-- Footer with Social Icons -->
  <footer>
    <p>&copy; 2025 Climate Guidance. All rights reserved.</p>
  </footer>

</body>
</html>
